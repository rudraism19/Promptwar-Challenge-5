name: Quality Checks

on:
  push:
    branches: [main, improve-ai-evaluation-score]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Run type checking
        run: npm run lint
      - name: Build production frontend
        run: npm run build
